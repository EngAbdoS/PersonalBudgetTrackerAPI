# docker/docker-compose.yml
services:

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 1000

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
      image: mongo-express:latest
      ports:
        - "8081:8081"
      environment:
        - ME_CONFIG_MONGODB_SERVER=mongo
        - ME_CONFIG_BASICAUTH=false
      depends_on:
        - mongo
  
volumes:
  redis_data:
  mongo_data: